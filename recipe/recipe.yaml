context:
  version: "3.22.0"

package:
  name: html-to-markdown-cli
  version: ${{ version }}

source:
  url: https://github.com/xberg-io/html-to-markdown/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 7a71c6b20218dda00e9f578db1370b04e410aa0e2ce542af130f74950d931934

build:
  number: 0
  script:
    env:
      AWS_LC_SYS_CMAKE_BUILDER: "1" # force CMake builder for `aws-lc-sys` native C/C++ code
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
    interpreter: nu
    content:
      - let prefix = $env.LIBRARY_PREFIX? | default $env.PREFIX
      # build main app and generate license data
      - cd crates/html-to-markdown-cli
      - ^cargo auditable install --path=. --root=($prefix) --no-track --locked --bins
      - ^cargo-bundle-licenses --format=yaml --output=../../THIRDPARTY.yml
      # generate shell completions
      - if: build_platform == host_platform
        then:
          - ^h2m              --generate-man             | save --force ($prefix)/share/man/man1/h2m.1
          - ^h2m              --generate-completion bash | save --force ($prefix)/share/bash-completion/completions/h2m
          - ^h2m              --generate-completion fish | save --force ($prefix)/share/fish/vendor_completions.d/h2m.fish
          - ^h2m              --generate-completion zsh  | save --force ($prefix)/share/zsh/site-functions/_h2m
          - ^html-to-markdown --generate-man             | save --force ($prefix)/share/man/man1/html-to-markdown.1
          - ^html-to-markdown --generate-completion bash | save --force ($prefix)/share/bash-completion/completions/html-to-markdown
          - ^html-to-markdown --generate-completion fish | save --force ($prefix)/share/fish/vendor_completions.d/html-to-markdown.fish
          - ^html-to-markdown --generate-completion zsh  | save --force ($prefix)/share/zsh/site-functions/_html-to-markdown

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - cmake
    - nushell
    - if: unix
      then: make

tests:
  - script:
      - h2m --help
      - h2m --version
      - html-to-markdown --help
      - html-to-markdown --version
  - package_contents:
      bin:
        - h2m
        - html-to-markdown
      files:
        - if: unix and build_platform == host_platform
          then:
            - share/man/man1/h2m.1
            - share/man/man1/html-to-markdown.1
            - share/bash-completion/completions/h2m
            - share/bash-completion/completions/html-to-markdown
            - share/fish/vendor_completions.d/h2m.fish
            - share/fish/vendor_completions.d/html-to-markdown.fish
            - share/zsh/site-functions/_h2m
            - share/zsh/site-functions/_html-to-markdown
        - if: win and build_platform == host_platform
          then:
            - Library/share/man/man1/h2m.1
            - Library/share/man/man1/html-to-markdown.1
            - Library/share/bash-completion/completions/h2m
            - Library/share/bash-completion/completions/html-to-markdown
            - Library/share/fish/vendor_completions.d/h2m.fish
            - Library/share/fish/vendor_completions.d/html-to-markdown.fish
            - Library/share/zsh/site-functions/_h2m
            - Library/share/zsh/site-functions/_html-to-markdown
      strict: true

about:
  summary: A fast, powerful HTML to Markdown converter
  description: |
    Command-line interface for html-to-markdown, a high-performance
    HTML to Markdown converter with comprehensive customization options.
    Uses the html5ever parser for standards-compliant HTML processing.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://docs.html-to-markdown.xberg.io
  repository: https://github.com/xberg-io/html-to-markdown

extra:
  recipe-maintainers:
    - salim-b
