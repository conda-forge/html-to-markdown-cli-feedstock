context:
  version: "3.17.0"

package:
  name: html-to-markdown-cli
  version: ${{ version }}

source:
  url: https://github.com/kreuzberg-dev/html-to-markdown/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 1e2615219ded67b7653fa58ef4cacacbae6b3b179e110e367165799ea8daa337

build:
  number: 0
  script:
    env:
      AWS_LC_SYS_CMAKE_BUILDER: "1" # force CMake builder for `aws-lc-sys` native C/C++ code
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
    interpreter: nu
    content:
      - let prefix = $env.LIBRARY_PREFIX? | default $env.PREFIX
      # build main app and generate license data
      - cd crates/html-to-markdown-cli
      - cargo auditable install --path=. --root=($prefix) --no-track --locked --bins
      - cargo-bundle-licenses --format=yaml --output=../../THIRDPARTY.yml
      # generate shell completions
      - if: build_platform == host_platform
        then:
          - mkdir ($prefix)/share/man/man1 ($prefix)/share/bash-completion/completions ($prefix)/share/fish/vendor_completions.d ($prefix)/share/zsh/site-functions
          - let bin = ($prefix)/bin/html-to-markdown
          - ^$bin --generate-man             | save ($prefix)/share/man/man1/html-to-markdown.1
          - ^$bin --generate-completion bash | save ($prefix)/share/bash-completion/completions/html-to-markdown
          - ^$bin --generate-completion fish | save ($prefix)/share/fish/vendor_completions.d/html-to-markdown.fish
          - ^$bin --generate-completion zsh  | save ($prefix)/share/zsh/site-functions/_html-to-markdown

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - cmake
    - nushell

tests:
  - script:
      - html-to-markdown --help
      - html-to-markdown --version
  - package_contents:
      bin:
        - html-to-markdown
      files:
        - if: unix and build_platform == host_platform
          then:
            - share/man/man1/html-to-markdown.1
            - share/bash-completion/completions/html-to-markdown
            - share/fish/vendor_completions.d/html-to-markdown.fish
            - share/zsh/site-functions/_html-to-markdown
        - if: win and build_platform == host_platform
          then:
            - Library/share/man/man1/html-to-markdown.1
            - Library/share/bash-completion/completions/html-to-markdown
            - Library/share/fish/vendor_completions.d/html-to-markdown.fish
            - Library/share/zsh/site-functions/_html-to-markdown
      strict: true

about:
  summary: A fast, powerful HTML to Markdown converter
  description: |
    Command-line interface for html-to-markdown, a high-performance
    HTML to Markdown converter with comprehensive customization options.
    Uses the html5ever parser for standards-compliant HTML processing.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://docs.html-to-markdown.kreuzberg.dev/
  repository: https://github.com/kreuzberg-dev/html-to-markdown

extra:
  recipe-maintainers:
    - salim-b
